# DeepSeek Harness bundle for the upstream Context Mode MCP runtime and DSH Skills.
- insert:
    - id: dsh-context-mode-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context_mode
        transport: stdio
        command: node
        args:
          # "context-mode/cli" is an exported subpath in context-mode@1.0.169.
          - !!js "require.resolve('context-mode/cli')"
        cwd: !!js "process.cwd()"
        env:
          CONTEXT_MODE_PLATFORM: dsh
        toolCallTimeoutMs: 60000
        failOnStartupError: false

    - id: dsh-context-mode-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: dsh-context-mode
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "require('node:path').join(require.resolve('dsh-context-mode/package.json'), '..', 'skills')"
        watch: true
