# DeepSeek Harness bundle for the upstream Context Mode MCP runtime, DSH
# Skills, and the native auto-trigger service.
- insert:
    - id: dsh-context-mode-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context_mode
        transport: stdio
        command: node
        args:
          # Resolve from the bundle's own installation directory, not the user's cwd.
          - !!js "process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('context-mode/cli')"
        cwd: !!js "process.env.CONTEXT_MODE_CWD || process.cwd()"
        env:
          CONTEXT_MODE_PLATFORM: dsh
        toolCallTimeoutMs: 60000
        failOnStartupError: false

    - id: dsh-context-mode-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: dsh-context-mode
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-context-mode/package.json')), 'skills')"
        watch: true

    - id: dsh-context-mode-auto
      name: 'dsh-context-mode/auto-trigger'
      # Native auto-trigger: runs the upstream context-mode hook scripts on
      # DSH lifecycle seams (SessionStart / PreToolUse / PostToolUse / Stop)
      # without a Claude Code hook bridge. Kill switch and overrides:
      # enabled, events, toolMatcher, timeoutMs, configDir, contextModeRoot
      # (see lib/auto-trigger.mjs module docs).
      config:
        enabled: true
